[package]
name = "custody-voter"
version = "1.0.3"
description = "Customer application for custody-delegated Zcash voting"
authors = ["Valar"]
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/custody-voter"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "custody_voter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
age = "0.12.1"
base64 = "0.22"
bip0039 = "0.12"
ff = "0.14"
group = "0.14"
hex = "0.4"
keyring = "4.1.6"
prost = "0.14"
rand = "0.8"
rand10 = { package = "rand", version = "0.10" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
secrecy = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14", features = ["channel", "tls-ring", "tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
vote-commitment-tree = "=0.6.1"
vote-commitment-tree-client = { version = "=0.8.1", features = ["http"] }
zcash_protocol = "0.10.4"
zcash_voting = "=5.0.0"
zeroize = "1"
zip32 = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# Local Testnet builds generate real proofs; optimize dependencies so a debug
# application remains practical while retaining application line tables.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
opt-level = 2
